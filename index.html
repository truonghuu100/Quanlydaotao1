<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061d3d">
  <title>HPDQ Training Management</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#061d3d;font-family:Arial,"Segoe UI",sans-serif}body{overflow:hidden}.shell{height:100%;display:flex;flex-direction:column}.bar{height:42px;flex:0 0 42px;display:flex;align-items:center;gap:10px;padding:0 14px;color:#eaf4ff;background:linear-gradient(90deg,#031735,#0a3970);border-bottom:1px solid rgba(255,255,255,.14);font-size:12px}.mark{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;background:linear-gradient(135deg,#ffe67d,#f2b632);color:#061d3d;font-weight:900}.brand{font-weight:800;letter-spacing:.04em}.status{margin-left:auto;color:#c7d8ec;font-size:11px}.frame-wrap{position:relative;flex:1;min-height:0;background:#f3f6fa}.frame-wrap iframe{display:block;width:100%;height:100%;border:0;background:#f3f6fa}.fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;background:#f3f6fa;color:#173753}.fallback a{color:#0868d7;font-weight:700}.fallback.show{display:flex}.fallback-inner{max-width:520px;line-height:1.6}.fallback button{border:0;border-radius:8px;padding:10px 14px;background:#0868d7;color:white;font-weight:700;cursor:pointer;margin-top:10px}@media(max-width:600px){.bar{height:36px;flex-basis:36px;padding:0 10px}.status{font-size:10px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="bar">
      <span class="mark">HP</span>
      <span class="brand">HPDQ TRAINING</span>
      <span class="status">Hệ thống quản lý đào tạo</span>
    </header>
    <main class="frame-wrap">
      <iframe id="trainingApp" title="HPDQ Training Management" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe>
      <div id="fallback" class="fallback"><div class="fallback-inner"><h2>Không thể hiển thị hệ thống trong khung này</h2><p>Đại ca vẫn có thể mở hệ thống đào tạo trực tiếp bằng nút bên dưới. Dữ liệu Google Sheets không bị thay đổi.</p><a id="directLink" href="#" target="_blank" rel="noopener">Mở HPDQ Training trực tiếp</a><br><button onclick="location.reload()">Thử tải lại</button></div></div>
    </main>
  </div>
  <script>
    // The existing Apps Script app remains the application/backend and source of truth.
    // Render hosts this lightweight entry page only; no Google Sheets schema changes are needed.
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwVKUkV8l3kCYMNjSPRn6x3dbS7sjxypD1zFEcm0L47wN1_jVZpmGwm81ME7Vj3BwTWFw/exec';
    const frame = document.getElementById('trainingApp');
    document.getElementById('directLink').href = APP_URL;
    frame.src = APP_URL;
    frame.addEventListener('error', () => document.getElementById('fallback').classList.add('show'));
    // Some browser/frame restrictions do not emit an iframe error event. Keep the direct link available in all cases.
  </script>
</body>
</html>
