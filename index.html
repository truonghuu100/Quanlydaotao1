<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061d3d">
  <title>HPDQ Training Management</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f6fa;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f3f6fa;
    }
    .fallback {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f3f6fa;
      color: #173753;
      font: 15px/1.6 Arial, sans-serif;
      text-align: center;
    }
    .fallback.show { display: flex; }
    .fallback a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      border-radius: 8px;
      background: #0868d7;
      color: white;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <iframe id="trainingApp" title="HPDQ Training Management"
    src="https://script.google.com/macros/s/AKfycbwVKUkV8l3kCYMNjSPRn6x3dbS7sjxypD1zFEcm0L47wN1_jVZpmGwm81ME7Vj3BwTWFw/exec"
    allow="clipboard-read; clipboard-write; fullscreen"
    allowfullscreen></iframe>
  <div class="fallback" id="fallback">
    <div>
      <strong>Không thể hiển thị hệ thống trong khung này.</strong>
      <p>Đại ca có thể mở ứng dụng đào tạo trực tiếp.</p>
      <a href="https://script.google.com/macros/s/AKfycbwVKUkV8l3kCYMNjSPRn6x3dbS7sjxypD1zFEcm0L47wN1_jVZpmGwm81ME7Vj3BwTWFw/exec" target="_blank" rel="noopener">Mở HPDQ Training</a>
    </div>
  </div>
  <script>
    const frame = document.getElementById('trainingApp');
    frame.addEventListener('error', () => {
      document.getElementById('fallback').classList.add('show');
    });
  </script>
</body>
</html>
